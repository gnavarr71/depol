<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAIN Image Analyzer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#12151c;color:#e4e7ee;font-family:Arial,sans-serif;padding:30px}
.container{max-width:900px;margin:0 auto}
h1{color:#4da3ff;font-size:1.5rem;margin-bottom:4px}
.sub{color:#8a93a6;margin-bottom:20px;font-size:.9rem}
#dropzone{border:2px dashed #3a4256;border-radius:12px;padding:55px 20px;text-align:center;cursor:pointer;background:#1a1f2b}
#dropzone.dragover,#dropzone:hover{border-color:#4da3ff;background:#20283a}
#dropzone p{pointer-events:none;color:#8a93a6}
#dropzone .big{font-size:1.15rem;color:#e4e7ee;margin-bottom:6px}
#panel{display:none;margin-top:22px;gap:22px;flex-wrap:wrap}
#panel.visible{display:flex}
.box{flex:1;min-width:290px;background:#1a1f2b;border-radius:12px;padding:16px}
#preview{max-width:100%;border-radius:8px;background:#fff;display:block}
.score{text-align:center;padding:16px;margin-bottom:14px;background:#1a1f2b;border-radius:12px}
.score .num{font-size:2.6rem;font-weight:700}
.check{background:#1a1f2b;border-radius:10px;padding:12px 15px;margin-bottom:9px;border-left:4px solid #555}
.check.pass{border-left-color:#3ecf72}
.check.warn{border-left-color:#f5b942}
.check.fail{border-left-color:#ff5c5c}
.check .t{font-weight:600;margin-bottom:3px}
.check .d{color:#aab2c4;font-size:.86rem}
.check .f{color:#4da3ff;font-size:.83rem;margin-top:5px}
button{margin-top:14px;background:#2a3348;color:#e4e7ee;border:0;padding:9px 20px;border-radius:8px;cursor:pointer}
button:hover{background:#3a4661}
</style>
</head>
<body>
<div class="container">
<h1>Amazon MAIN Image Analyzer</h1>
<p class="sub">100% client-side. Nothing is uploaded anywhere.</p>
<div id="dropzone">
  <p class="big">&#128247; Drop your image here or click to browse</p>
  <p>JPG / PNG / WEBP</p>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div id="panel">
  <div class="box">
    <img id="preview" alt="">
    <button id="resetBtn">Analyze another image</button>
  </div>
  <div class="box" style="background:transparent;padding:0">
    <div class="score"><div class="num" id="scoreNum">&mdash;</div><div style="color:#8a93a6;font-size:.85rem">COMPLIANCE SCORE</div></div>
    <div id="checks"></div>
  </div>
</div>
</div>

<script>
var dz=document.getElementById('dropzone'),
    fi=document.getElementById('fileInput'),
    panel=document.getElementById('panel'),
    preview=document.getElementById('preview'),
    checksEl=document.getElementById('checks'),
    scoreNum=document.getElementById('scoreNum');

dz.onclick=function(){fi.click();};
fi.onchange=function(){if(fi.files.length)handleFile(fi.files[0]);};

dz.ondragover=function(e){e.preventDefault();dz.classList.add('dragover');};
dz.ondragleave=function(e){e.preventDefault();dz.classList.remove('dragover');};
dz.ondrop=function(e){
  e.preventDefault();dz.classList.remove('dragover');
  if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);
};
window.addEventListener('dragover',function(e){e.preventDefault();});
window.addEventListener('drop',function(e){e.preventDefault();});

document.getElementById('resetBtn').onclick=function(){
  panel.classList.remove('visible');dz.style.display='block';
  fi.value='';checksEl.innerHTML='';scoreNum.textContent='\u2014';
};

function handleFile(file){
  if(!file.type.match('image')){alert('Please select an image file.');return;}
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      preview.src=ev.target.result;
      dz.style.display='none';
      panel.classList.add('visible');
      analyze(img);
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}

function addCheck(type,title,detail,fix){
  var d=document.createElement('div');
  d.className='check '+type;
  d.innerHTML='<div class="t">'+(type==='pass'?'\u2705 ':type==='warn'?'\u26A0\uFE0F ':'\u274C ')+title+
    '</div><div class="d">'+detail+'</div>'+(fix?'<div class="f">Fix: '+fix+'</div>':'');
  checksEl.appendChild(d);
  return type==='pass'?1:type==='warn'?0.5:0;
}

function analyze(img){
  checksEl.innerHTML='';
  var W=img.naturalWidth,H=img.naturalHeight;
  var scale=Math.min(1,600/Math.max(W,H));
  var cw=Math.round(W*scale),ch=Math.round(H*scale);
  var c=document.createElement('canvas');c.width=cw;c.height=ch;
  var ctx=c.getContext('2d');ctx.drawImage(img,0,0,cw,ch);
  var data=ctx.getImageData(0,0,cw,ch).data;
  var score=0,total=0;

  function px(x,y){var i=(y*cw+x)*4;return[data[i],data[i+1],data[i+2]];}
  function white(p){return p[0]>=245&&p[1]>=245&&p[2]>=245;}
  function nearWhite(p){return p[0]>=228&&p[1]>=228&&p[2]>=228;}

  // 1. Resolution
  total++;
  if(W>=1600&&H>=1600)score+=addCheck('pass','Resolution',W+' \u00D7 '+H+' px \u2014 great for zoom.');
  else if(W>=1000&&H>=1000)score+=addCheck('warn','Resolution',W+' \u00D7 '+H+' px \u2014 meets minimum, limited zoom.','Export at 1600\u00D71600 px or larger.');
  else score+=addCheck('fail','Resolution',W+' \u00D7 '+H+' px \u2014 below Amazon minimum.','Re-export at minimum 1000\u00D71000 px, ideally 1600+.');

  // 2. White background (border sampling)
  total++;
  var b=0,w=0,nw=0,m=Math.max(2,Math.floor(Math.min(cw,ch)*0.04));
  for(var x=0;x<cw;x+=3){
    for(var o=0;o<m;o++){
      var p1=px(x,o),p2=px(x,ch-1-o);
      b+=2;
      if(white(p1))w++;else if(nearWhite(p1))nw++;
      if(white(p2))w++;else if(nearWhite(p2))nw++;
    }
  }
  for(var y=0;y<ch;y+=3){
    for(var o2=0;o2<m;o2++){
      var p3=px(o2,y),p4=px(cw-1-o2,y);
      b+=2;
      if(white(p3))w++;else if(nearWhite(p3))nw++;
      if(white(p4))w++;else if(nearWhite(p4))nw++;
    }
  }
  var wr=w/b,nr=(w+nw)/b;
  if(wr>=0.95)score+=addCheck('pass','White background',(wr*100).toFixed(1)+'% of border is pure white RGB(255,255,255).');
  else if(nr>=0.90)score+=addCheck('warn','White background','Near-white but not pure ('+(wr*100).toFixed(1)+'% pure).','Select the background and fill with #FFFFFF. Off-white can trigger flags.');
  else score+=addCheck('fail','White background','Only '+(wr*100).toFixed(1)+'% of border is white.','Cut out the product and place it on a pure white #FFFFFF canvas.');

  // 3. Occupancy (bounding box of non-white pixels)
  total++;
  var minX=cw,minY=ch,maxX=0,maxY=0,found=false;
  for(var yy=0;yy<ch;yy+=2)for(var xx=0;xx<cw;xx+=2){
    if(!nearWhite(px(xx,yy))){
      found=true;
      if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;
      if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;
    }
  }
  if(found){
    var occ=Math.max((maxX-minX)/cw,(maxY-minY)/ch);
    if(occ>=0.85)score+=addCheck('pass','Product occupancy',(occ*100).toFixed(0)+'% of frame \u2014 meets the 85% rule.');
    else if(occ>=0.70)score+=addCheck('warn','Product occupancy',(occ*100).toFixed(0)+'% \u2014 slightly small.','Crop closer so the product fills \u226585% of the longest side.');
    else score+=addCheck('fail','Product occupancy',(occ*100).toFixed(0)+'% \u2014 product too small.','Crop tightly: product should dominate (\u226585%).');
  } else {
    score+=addCheck('fail','Product occupancy','No product detected \u2014 image appears fully white.','Check the image contains the product.');
  }

  // 4. Frame / border touching edges
  total++;
  var en=0,et=0;
  for(var ex=0;ex<cw;ex+=3){et+=2;if(!nearWhite(px(ex,0)))en++;if(!nearWhite(px(ex,ch-1)))en++;}
  for(var ey=0;ey<ch;ey+=3){et+=2;if(!nearWhite(px(0,ey)))en++;if(!nearWhite(px(cw-1,ey)))en++;}
  var fr=en/et;
  if(fr>0.5)score+=addCheck('fail','Frame / border',(fr*100).toFixed(0)+'% of outer pixels non-white \u2014 likely a frame.','Remove frames, borders or watermark bars touching edges.');
  else if(fr>0.15)score+=addCheck('warn','Frame / border','Elements touch the edge ('+(fr*100).toFixed(0)+'%).','Leave a small white margin at all edges.');
  else score+=addCheck('pass','Frame / border','No frame or border detected.');

  // 5. Promo red
  total++;
  var rc=0,tc=0;
  for(var ry=0;ry<ch;ry+=3)for(var rx=0;rx<cw;rx+=3){
    var rp=px(rx,ry);tc++;
    if(rp[0]>190&&rp[1]<90&&rp[2]<90)rc++;
  }
  var rr=rc/tc;
  if(rr>0.06)score+=addCheck('fail','Promo graphics (red)',(rr*100).toFixed(1)+'% hot-red pixels \u2014 typical of SALE badges.','Remove badges/banners from MAIN; move them to secondary images.');
  else if(rr>0.025)score+=addCheck('warn','Promo graphics (red)',(rr*100).toFixed(1)+'% hot-red pixels.','Fine if the red is the product itself; remove if it is a badge.');
  else score+=addCheck('pass','Promo graphics (red)','No significant promo-red areas.');

  // 6. Edge text density
  total++;
  function band(y0,y1){
    var tr=0,s=0;
    for(var by=y0;by<y1;by+=2){
      var prev=null;
      for(var bx=1;bx<cw;bx+=2){
        var bp=px(bx,by);
        var dark=(0.299*bp[0]+0.587*bp[1]+0.114*bp[2])<120;
        if(prev!==null&&dark!==prev)tr++;
        prev=dark;s++;
      }
    }
    return s?tr/s:0;
  }
  var bh=Math.floor(ch*0.12);
  var td=Math.max(band(0,bh),band(ch-bh,ch));
  if(td>0.08)score+=addCheck('fail','Edge text density','High transition density ('+(td*100).toFixed(1)+'%) in top/bottom \u2014 likely text overlays.','Remove headline/claim text from top and bottom of the MAIN image.');
  else if(td>0.04)score+=addCheck('warn','Edge text density','Moderate density ('+(td*100).toFixed(1)+'%).','If this is product-printed text it is fine; remove any added overlays.');
  else score+=addCheck('pass','Edge text density','No text-overlay pattern detected at edges.');

  var pct=Math.round((score/total)*100);
  scoreNum.textContent=pct+'%';
  scoreNum.style.color=pct>=80?'#3ecf72':pct>=55?'#f5b942':'#ff5c5c';
}
</script>
</body>
</html>
