<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de fotos</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page-title {
      margin: 0;
      padding: 36px 24px 28px;
      text-align: center;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 600;
    }

    .gallery {
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px 16px;
    }

    .photo-card {
      min-width: 0;
    }

    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eee;
    }

    .title {
    margin: 9px 0 0;
    font-size: 36px;
    line-height: 1.3;
    font-weight: 600;
    text-align: center;
    font-family: Gotham, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    @media (max-width: 700px) {
      .page-title {
        padding: 24px 12px 20px;
        font-size: 24px;
      }

      .gallery {
        padding: 14px 12px 24px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px 8px;
      }

      .title {
        margin-top: 7px;
        font-size: 12px;
      }
    }
  </style>
</head>
